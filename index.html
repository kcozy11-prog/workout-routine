<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAFAF7">
<meta name="apple-mobile-web-app-title" content="운동 루틴">
<title>주간 운동 루틴</title>
<style>
  :root{
    --paper:#FAFAF7; --ink:#1B1B1A; --ink-soft:#55554F;
    --line:#D9D9D2; --line-dark:#9C9C93;
    --accent:#2F5D3A; --accent-soft:#EAF0EB; --rest:#8A6D3B;
    --sans:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    --serif:"Noto Serif KR","Apple Myungjo","AppleMyungjo",Batang,"바탕",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.65;font-size:15px;padding-bottom:60px}
  header{padding:20px 16px 10px;border-bottom:1px solid var(--ink);position:relative}
  #sndBtn{position:absolute;right:14px;top:24px;padding:7px 11px;border:1px solid var(--line-dark);background:#fff;font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);border-radius:2px;cursor:pointer}
  #sndBtn.off{color:var(--rest);border-color:var(--rest)}
  header h1{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:-0.3px}
  header p{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  header .upd{font-family:var(--sans);font-size:11px;color:var(--ink-soft);margin-top:5px}
  header .upd b{font-weight:600;color:var(--accent)}
  nav{display:flex;border-bottom:1px solid var(--line-dark);position:sticky;top:0;background:var(--paper);z-index:10}
  nav button{flex:1;padding:11px 2px;background:none;border:none;font-family:var(--sans);font-size:12px;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer}
  nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
  main{padding:14px 14px}
  .hidden{display:none}

  .days{display:flex;gap:4px;margin-bottom:12px}
  .days button{flex:1;padding:8px 0;border:1px solid var(--line);background:#fff;font-family:var(--sans);font-size:13px;color:var(--ink-soft);cursor:pointer;border-radius:2px}
  .days button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .days button .dot{display:block;font-size:9px;line-height:1;margin-top:2px;color:var(--accent)}
  .days button.sel .dot{color:#9FD3AC}
  .today-label{font-family:var(--sans);font-size:12px;color:var(--accent);margin-bottom:10px}
  .addbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .addbar .lbl{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);margin-right:2px}
  .addbar button{padding:6px 10px;border:1px solid var(--line-dark);background:#fff;font-family:var(--sans);font-size:12px;color:var(--ink-soft);border-radius:2px;cursor:pointer}
  .addbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .goal{border:1px solid var(--ink);background:#fff;margin-bottom:12px;border-radius:2px}
  .goal-head{display:flex;align-items:baseline;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .goal-head .t{font-family:var(--sans);font-weight:700;font-size:14px}
  .goal-head .s{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);margin-left:auto;text-align:right}
  .goal-row{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
  .goal-row:last-child{border-bottom:none}
  .goal-row .k{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);flex:0 0 74px}
  .goal-row .v{flex:1}
  .goal-row .v b{font-family:var(--sans);font-size:15px;color:var(--accent)}
  .stages{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1}
  .stages button{width:30px;height:28px;border:1px solid var(--line-dark);background:#fff;font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);border-radius:2px;cursor:pointer}
  .stages button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stages .sd{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);width:100%}

  .block{border:1px solid var(--line);background:#fff;margin-bottom:12px;border-radius:2px}
  .block-head{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid var(--line)}
  .block-head input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
  .block-head .t{font-family:var(--sans);font-weight:700;font-size:14px}
  .block-head .s{font-size:11.5px;color:var(--ink-soft);margin-left:auto;font-family:var(--sans);flex-shrink:0;text-align:right}
  .block-body{padding:4px 12px 10px}
  .note{font-size:12.5px;color:var(--ink-soft);padding:8px 2px 4px}

  .ex{border-bottom:1px dashed var(--line);padding:9px 0}
  .ex:last-child{border-bottom:none}
  .ex-head{display:flex;align-items:baseline;gap:7px;cursor:pointer}
  .ex-head .n{font-weight:600;font-size:14.5px}
  .ex-head .d{font-size:11.5px;color:var(--ink-soft);font-family:var(--sans);margin-left:auto;text-align:right;flex-shrink:0}
  .ex-head .arrow{font-size:11px;color:var(--line-dark)}
  .ex-head .prog{font-family:var(--sans);font-size:11px;color:var(--accent);flex-shrink:0}
  .ex-detail{display:none;margin-top:8px;padding:10px 11px;background:var(--accent-soft);border-left:2px solid var(--accent);font-size:13.5px}
  .ex.open .ex-detail{display:block}
  .ex-detail .what{margin-bottom:6px}
  .ex-detail ol{padding-left:18px;margin:4px 0}
  .ex-detail ol li{margin-bottom:3px}
  .ex-detail .cau{margin-top:7px;font-size:12.5px;color:#7A3B2E}
  .ex-detail .cau::before{content:"주의, "}

  .tracker{margin-top:10px;padding-top:9px;border-top:1px solid #CBDACE;font-family:var(--sans)}
  .tracker .lbl{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px}
  .setrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
  .setrow button{min-width:44px;height:36px;border:1px solid var(--line-dark);background:#fff;font-family:var(--sans);font-size:13px;color:var(--ink-soft);border-radius:2px;cursor:pointer}
  .setrow button.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .wrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
  .wrow input{width:56px;height:34px;border:1px solid var(--line-dark);border-radius:2px;text-align:center;font-family:var(--sans);font-size:13px;background:#fff}
  .wrow .u{font-size:11.5px;color:var(--ink-soft)}
  .tbtn{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
  .tbtn button{padding:8px 14px;font-family:var(--sans);font-size:13px;font-weight:700;background:var(--ink);color:#fff;border:none;border-radius:2px;cursor:pointer}
  .tdisp{font-family:var(--sans);font-size:18px;font-weight:700;min-width:44px}
  .tphase{font-size:12px;color:var(--ink-soft)}
  .tphase.work{color:var(--accent);font-weight:700}
  .tphase.rest{color:var(--rest);font-weight:700}
  .memo{width:100%;border:1px solid var(--line-dark);border-radius:2px;background:#fff;font-family:var(--serif);font-size:13px;padding:7px 8px;margin-top:2px;resize:vertical;min-height:38px}
  .daymemo-wrap{margin:4px 0 14px}
  .daymemo-wrap .lbl{font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin-bottom:4px}

  .dict-group{margin-bottom:18px}
  .dict-group h3{font-family:var(--sans);font-size:13px;color:var(--ink-soft);font-weight:700;border-bottom:1px solid var(--line-dark);padding-bottom:5px;margin-bottom:4px}

  table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
  th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
  th{font-family:var(--sans);font-size:12px;font-weight:700}
  td.time{font-family:var(--sans);white-space:nowrap;width:52px}
  tr.now td{background:var(--accent-soft)}
  .timer-bar{display:flex;align-items:center;gap:12px;margin:12px 0}
  .timer-bar button{padding:10px 18px;font-family:var(--sans);font-size:14px;font-weight:700;background:var(--ink);color:#fff;border:none;border-radius:2px;cursor:pointer}
  .timer-bar .clock{font-family:var(--sans);font-size:22px;font-weight:700;letter-spacing:1px}
  .timer-bar .seg{font-size:13px;color:var(--ink-soft)}

  .habit-group{margin-bottom:16px}
  .habit-group h3{font-family:var(--sans);font-size:13.5px;font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line-dark)}
  .habit-group ul{list-style:none}
  .habit-group li{padding:6px 0 6px 14px;border-bottom:1px dashed var(--line);font-size:13.5px;position:relative}
  .habit-group li::before{content:"—";position:absolute;left:0;color:var(--line-dark)}
  .habit-group li:last-child{border-bottom:none}
  .habit-group li.figli{padding-left:0;border-bottom:none}
  .habit-group li.figli::before{content:none}
  .fig{margin:6px 0 8px;padding:9px 7px 7px;border:1px solid var(--line);background:#fff;border-radius:2px}
  .fig svg{display:block;width:100%;height:auto}
  .ex-detail .fig{margin:9px 0}
  .fig figcaption{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
  .fig .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .fig .thin{stroke-width:1.3}
  .fig .mk{stroke-width:2.4;fill:none}
  .fig .bad{stroke:#7A3B2E}
  .fig .good{stroke:var(--accent)}
  .fig .gd{fill:none;stroke:var(--line-dark);stroke-width:1;stroke-dasharray:3 3}
  .fig .gr{fill:none;stroke:var(--line-dark);stroke-width:1.2}
  .fig .dot{fill:var(--accent);stroke:none}
  .fig .box{fill:var(--accent-soft);stroke:var(--line-dark);stroke-width:1.5}
  .fig .kb{fill:#E5E5DE;stroke:var(--line-dark);stroke-width:1.4;stroke-linejoin:round}
  .fig .bench{fill:none;stroke:#CFCFC6;stroke-width:9;stroke-linecap:round}
  .fig .db{fill:#B9B9B0;stroke:none}
  .fig .lt{stroke:#BDBDB4}
  .fig .shade{fill:var(--accent-soft);stroke:none}
  .fig .bar{fill:var(--accent);stroke:none}
  .fig .sm{font-family:var(--sans);font-size:9.5px;fill:var(--ink-soft)}
  .fig .mkb{font-family:var(--sans);font-size:17px;font-weight:700;fill:#7A3B2E}
  .fig .mkg{font-family:var(--sans);font-size:17px;font-weight:700;fill:var(--accent)}
  .lead{font-size:13px;color:var(--ink-soft);margin-bottom:12px}

  .rec-sec{margin-bottom:22px}
  .rec-sec h3{font-family:var(--sans);font-size:13.5px;font-weight:700;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid var(--line-dark)}
  .rec-sec .empty{font-size:12.5px;color:var(--ink-soft);padding:4px 0}
  .ib-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-family:var(--sans)}
  .ib-form input{border:1px solid var(--line-dark);border-radius:2px;background:#fff;font-family:var(--sans);font-size:12.5px;padding:7px 6px}
  .ib-form input.dt{width:118px}
  .ib-form input.num{width:60px;text-align:center}
  .ib-form button{padding:8px 13px;font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--ink);color:#fff;border:none;border-radius:2px;cursor:pointer}
  .memoline{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .memoline b{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);font-weight:400;display:block}

  /* 하루 기록, 식사와 몸 상태 */
  .dx-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-family:var(--sans)}
  .dx-row.nb{border-bottom:none}
  .dx-lbl{font-size:12.5px;color:var(--ink-soft);flex-shrink:0;min-width:92px}
  .dx-lbl b{color:var(--ink);font-size:13px}
  .tagbtns{display:flex;gap:5px;flex-wrap:wrap}
  .tagbtns button{padding:7px 12px;border:1px solid var(--line-dark);background:#fff;font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);border-radius:2px;cursor:pointer}
  .tagbtns button.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .tagbtns button.no.sel{background:var(--rest);border-color:var(--rest)}
  .meal-memo{width:100%;border:1px solid var(--line-dark);border-radius:2px;background:#fff;font-family:var(--serif);font-size:13px;padding:7px 8px;margin:8px 0 2px}
  .dx-scale{padding:7px 0 9px;border-bottom:1px dashed var(--line);font-family:var(--sans)}
  .dx-scale:last-of-type{border-bottom:none}
  .dx-scale .dx-lbl{display:block;margin-bottom:6px}
  .scale{display:flex;gap:3px}
  .scale button{flex:1;min-width:0;height:32px;padding:0;border:1px solid var(--line);background:#fff;font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);border-radius:2px;cursor:pointer}
  .scale.pain button.sel{background:var(--rest);border-color:var(--rest);color:#fff;font-weight:700}
  .scale.good button.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  /* 기록 탭, 주간 이동과 백업 */
  .wknav{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:var(--sans)}
  .wknav button{padding:8px 12px;border:1px solid var(--line-dark);background:#fff;font-size:12.5px;border-radius:2px;cursor:pointer;color:var(--ink)}
  .wknav button:disabled{opacity:.3;cursor:default}
  .wknav .lbl{flex:1;text-align:center;font-size:13px;font-weight:700}
  .prot-line{font-family:var(--sans);font-size:12.5px;margin:2px 0 7px}
  .prot-line b{color:var(--accent)}
  .bk-btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;font-family:var(--sans)}
  .bk-btns button{padding:8px 12px;border:1px solid var(--line-dark);background:#fff;font-family:var(--sans);font-size:12.5px;color:var(--ink);border-radius:2px;cursor:pointer}
  #bkTa{width:100%;min-height:110px;margin-top:6px;font-family:Consolas,monospace;font-size:11px;border:1px solid var(--line-dark);border-radius:2px;padding:6px;background:#fff;resize:vertical}
</style>
</head>
<body>
<header>
  <h1>주간 운동 루틴</h1>
  <p>체력·둔근·골반저근·자세 교정 중심, 협착·목디스크 기질 고려</p>
  <p class="upd">최종 업데이트 <b id="updAt">—</b></p>
  <button id="sndBtn" title="타이머 알림음 켜고 끄기">소리 켬</button>
</header>
<nav>
  <button class="on" data-tab="plan">주간 계획</button>
  <button data-tab="dict">운동 사전</button>
  <button data-tab="massage">마사지</button>
  <button data-tab="habit">일상 습관</button>
  <button data-tab="record">기록</button>
</nav>
<main>

<section id="tab-plan">
  <div id="goalArea"></div>
  <div class="days" id="dayStrip"></div>
  <div class="today-label" id="todayLabel"></div>
  <div class="addbar"><span class="lbl">오늘 추가</span><button data-add="C">헬스장 C</button><button data-add="D">집 D</button><button data-add="R">내전근 풀기</button></div>
  <div id="planArea"></div>
</section>

<section id="tab-dict" class="hidden">
  <p class="lead">동작 이름을 누르면 방법이 펼쳐집니다. 통증이나 저림이 심해지는 동작은 그 동작만 중단하면 됩니다.</p>
  <div id="dictArea"></div>
</section>

<section id="tab-massage" class="hidden">
  <p class="lead">폼롤러와 라크로스볼로 정확히 10분. 표 순서대로 진행하고, 타이머를 켜면 현재 구간이 표시됩니다. 아픈 지점을 만나면 그 자리에서 10초 정도 지그시 눌러 호흡합니다.</p>
  <div class="timer-bar">
    <button id="timerBtn">타이머 시작</button>
    <span class="clock" id="clock">0:00</span>
    <span class="seg" id="segName"></span>
  </div>
  <table id="massageTable">
    <thead><tr><th>시간</th><th>부위·도구</th><th>방법</th></tr></thead>
    <tbody></tbody>
  </table>
  <p class="note">허리(요추) 위에서 폼롤러를 직접 굴리는 것은 협착이 있는 경우 피합니다. 등 상부까지만 다룹니다.</p>
</section>

<section id="tab-habit" class="hidden">
  <div id="habitArea"></div>
</section>

<section id="tab-record" class="hidden">
  <div id="recordArea"></div>
</section>

</main>
<script>
/* ---------- 운동 데이터 ---------- */
/* sets: 세트 수, weighted: 무게 기록란, timed:{work,rest}: 세트당 자동 타이머(초), ph:{w,r}: 타이머 문구 */
const EX = {
  pelvicTilt:{n:"골반 기울이기",d:"10회",sets:1,w:"누운 자세에서 허리와 바닥 사이의 빈 공간을 붙였다 뗐다 하며 골반을 앞뒤로 굴리는 동작. 허리 주변을 부드럽게 풀고 아랫배 힘 쓰는 법을 익힙니다.",s:["무릎을 세우고 눕는다. 발은 골반 너비.","숨을 내쉬면서 아랫배에 힘을 주어 허리를 바닥에 지그시 붙인다. 골반이 뒤로 굴러가는 느낌.","3초 유지한다.","숨을 마시며 힘을 풀어 허리 아래에 손가락이 들어갈 정도의 공간을 만든다.","이것을 1회로 하여 10회."],c:"통증 없는 범위에서만. 협착이 있으므로 허리를 젖히는 방향은 작게, 바닥에 붙이는 방향 위주로."},
  catcow:{n:"캣카우",d:"10회",sets:1,w:"네발기기 자세로 등을 둥글게 말았다 폈다 하며 척추 전체를 마디마디 움직이는 동작.",s:["손은 어깨 아래, 무릎은 골반 아래에 두고 네발기기.","숨을 내쉬며 등을 천장으로 둥글게 말고 시선은 배꼽.","숨을 마시며 가슴을 앞으로 열고 시선은 살짝 위. 허리는 과하게 꺾지 않는다.","천천히 10회 반복."],c:"허리를 아래로 꺾는 동작(카우)은 작게. 목도 과하게 젖히지 않는다."},
  chestOpen:{n:"누워서 가슴 열기",d:"1분",sets:1,timed:{work:60,rest:0},w:"라운드숄더로 짧아진 가슴 앞쪽을 여는 스트레칭. 폼롤러나 만 수건을 등에 받치고 눕기만 하면 됩니다.",s:["폼롤러를 척추 방향(세로)으로 놓고 그 위에 등 전체를 대고 눕는다. 머리도 롤러 위에 올린다.","무릎은 세우고, 양팔을 옆으로 벌려 손바닥이 천장을 보게 한다.","가슴 앞쪽이 당기는 지점에서 팔 높이를 조절하며 1분간 깊게 호흡한다.","수건을 쓸 경우 어깨뼈 아래에 가로로 받친다."],c:"목이 뒤로 꺾이면 수건을 접어 머리를 받친다. 손 저림이 심해지면 팔 각도를 낮춘다."},
  chinTuck:{n:"턱 당기기",d:"10회",sets:1,w:"거북목 교정의 기본. 턱을 목 쪽으로 수평으로 당겨 뒤통수를 뒤로 미는 동작.",s:["앉거나 서서 시선은 정면.","턱 끝에 손가락을 대고, 턱을 아래로 숙이는 게 아니라 수평으로 뒤로 민다. 이중턱을 만드는 느낌.","뒤통수가 뒤로 길어지는 느낌으로 3초 유지.","10회. 벽에 뒤통수를 대고 지그시 미는 방식도 좋다."],c:"어지럽거나 손 저림이 심해지면 횟수를 줄인다."},
  clamshell:{n:"클램쉘",d:"양쪽 10회씩",sets:2,setLbl:["왼쪽","오른쪽"],w:"옆으로 누워 조개가 열리듯 무릎을 벌리는 동작. 엉덩이 옆·바깥 근육(중둔근)을 깨워 골반 안정에 좋습니다.",s:["옆으로 눕고 무릎을 90도 정도 굽혀 포갠다. 발뒤꿈치는 붙인 채.","골반이 뒤로 넘어가지 않게 고정하고, 위쪽 무릎만 천장 쪽으로 벌린다.","엉덩이 옆이 조여지는 느낌에서 1초 멈췄다가 천천히 내린다.","10회 후 반대쪽. 익숙해지면 무릎에 테라밴드를 감는다."],c:"허리를 비틀며 벌리지 않는다. 골반은 고정. 오른쪽이 약하니 오른쪽은 한 세트 더.",figs:[{k:"clam",cap:"옆으로 누워 발뒤꿈치를 붙인 채 위쪽 무릎만 연다. 골반이 뒤로 따라 넘어가면 엉덩이 옆이 아니라 허리가 일한다. 골반은 벽에 등을 댄 것처럼 고정하고, 열리는 만큼만 연다."}]},
  ringSqueeze:{n:"필라테스링 무릎 조이기",d:"20초 조이기 5회",sets:5,timed:{work:20,rest:10},w:"약한 내전근(허벅지 안쪽)을 앉은 채로 깨우는 운동. 무릎이 벌어지는 습관의 직접 처방입니다. 타이머를 누르면 20초 조이기와 10초 휴식이 자동으로 번갈아 진행되고 세트가 체크됩니다.",s:["의자에 바르게 앉아 무릎 사이에 링(없으면 접은 수건이나 책)을 끼운다.","허벅지 안쪽으로 링을 지그시 조인 채 20초 유지. 호흡은 계속.","10초 쉬고 5회 반복."],c:"숨을 참지 않는다. 허리를 세운 상태에서. 허벅지 안쪽에 근육통이 남아 있는 날은 이 동작 대신 루틴 R의 약하게 조였다 풀기로 대체한다."},
  kegel:{n:"골반저근 조이기(케겔)",d:"내쉬며 5초 조이고 마시며 5초 풀기 10회",sets:10,timed:{work:5,rest:5},ph:{w:"내쉬며 조이기",r:"마시며 풀기"},w:"골반저근 운동. 항문 조임과 변실금 개선의 핵심이며, 눈에 안 보이니 사무실이든 버스 안이든 어디서나 할 수 있습니다. 호흡과 짝을 지어야 제대로 됩니다. 숨을 내쉴 때 골반저근이 자연스럽게 올라오고 마실 때 내려오니, 그 리듬에 맞춥니다.",s:["앉아서 발을 바닥에 두고 골반을 세운다. 카피스코 안장 자세가 좋다.","숨을 내쉬면서 소변과 방귀를 동시에 참듯 항문과 그 앞쪽을 위로 끌어올린다. 5초.","숨을 마시면서 완전히 내려놓는다. 5초. 푸는 것까지가 한 세트.","엉덩이, 허벅지, 배에는 힘이 들어가지 않아야 한다. 손을 배에 얹어 확인한다.","10회. 기침이나 재채기가 나올 것 같으면 그 직전에 미리 한 번 조인다."],c:"열에 일곱이 엉덩이나 배로 대신 조인다. 배가 아플 때 대변이 새는 일이 있었다면 산부인과나 재활의학과에서 골반저근 물리치료(바이오피드백)를 받는 것이 가장 빠르다. 소변 보는 도중에 끊는 연습은 하지 않는다.",figs:[{k:"kegelBreath",cap:"숨을 마실 때 골반저근은 내려가고 내쉴 때 올라온다. 그래서 내쉬는 5초에 조이고 마시는 5초에 완전히 푼다. 타이머가 이 리듬을 안내한다. 기침·재채기 직전에 한 번 미리 조이는 것도 같은 원리다."}]},
  scapRetraction:{n:"어깨날개 모으기",d:"10회",sets:1,w:"날개뼈(견갑골)를 등 뒤로, 그리고 살짝 아래 방향까지 모으는 동작.",s:["앉거나 서서 팔은 편하게 둔다.","양쪽 날개뼈 사이에 연필을 끼워 잡는다는 느낌으로 뒤로, 그리고 살짝 아래로 모은다.","어깨가 귀 쪽으로 으쓱 올라가면 안 된다. 오히려 어깨는 끌어내린다.","3초 유지 후 풀기, 10회."],c:"허리를 꺾어 가슴만 내미는 것과 구별한다. 움직이는 건 날개뼈."},
  bandPullApart:{n:"테라밴드 팔 벌리기",d:"15회",sets:1,w:"밴드를 양손으로 잡고 가슴 앞에서 옆으로 당겨 벌리는 동작. 등 상부를 강화해 라운드숄더를 교정합니다.",s:["밴드를 어깨너비보다 좁게 잡고 팔을 가슴 높이로 뻗는다.","팔꿈치를 편 채 밴드를 옆으로 당겨 가슴에 닿을 때까지 벌린다.","날개뼈가 모이는 느낌을 확인하고 천천히 되돌린다.","15회."],c:"어깨가 으쓱 올라가지 않게. 반동 금지."},
  extRotation:{n:"견갑 외회전",d:"양쪽 10회씩",sets:2,setLbl:["왼팔","오른팔"],w:"팔꿈치를 옆구리에 붙인 채 아령이나 밴드를 바깥으로 돌리는 동작. 어깨 뒤쪽 회전근을 강화합니다.",s:["1kg 아령을 한 손에 쥐고 팔꿈치를 90도로 굽혀 옆구리에 붙인다.","팔꿈치는 붙인 채로 손만 바깥쪽으로 천천히 돌린다.","끝에서 1초 멈추고 되돌린다. 10회 후 반대쪽."],c:"팔꿈치가 옆구리에서 떨어지면 효과가 없다. 수건을 끼우고 해도 좋다."},
  gluteBridge:{n:"글루트브릿지",d:"단계별",sets:3,weighted:true,w:"누워서 엉덩이를 들어 올리는 동작. 이 계획의 중심이고, 아침·헬스장·집 세 세션 모두에서 '이것만 하면 성공'입니다. 허리로 드는 것과 엉덩이로 드는 것은 겉보기에 비슷하지만 전혀 다른 운동이라, 무게보다 먼저 이 구분을 몸에 익힙니다. 현재 단계는 주간 계획 맨 위 목표 칸에서 고릅니다.",s:["무릎 세우고 눕는다. 발은 골반 너비, 뒤꿈치는 엉덩이 가까이. 발은 뒤꿈치·엄지 아래·새끼 아래 세 점으로 바닥을 누른다.","골반 기울이기부터. 숨을 내쉬며 허리를 바닥에 붙이고(꼬리뼈가 살짝 말린다), 그 상태를 유지한 채 엉덩이를 조이며 올라간다.","무릎-골반-어깨가 한 줄이 되는 지점까지만. 더 올리면 허리가 젖혀진다. 갈비뼈는 내린 채.","정점에서 2초 조인다. 엉덩이가 조여지고 허리는 아무 느낌이 없어야 맞다.","1단계(1~2주) 12회 3세트 / 2단계(3~4주) 정점 10초 홀드 5회 3세트, 무릎에 밴드 / 3단계(5~8주) 한 다리 8회 좌우 3세트 / 4단계(9주~) 덤벨을 골반 위에 올리고 10회 3세트."],c:"허리로 밀어 올려 배가 솟는 아치가 되면 안 된다. 허리가 아프면 낮게, 골반 기울인 상태를 유지할 수 있는 높이까지만. 4단계 전에는 무게란을 비워 둔다.",figs:[{k:"bridge",cap:"✕ 허리로 밀어 올리면 배가 솟고 허리가 꺾인다. 엉덩이는 일하지 않고 허리만 아프다. ○ 골반을 살짝 말아 넣은 채 엉덩이를 조여 올린다. 어깨-골반-무릎이 한 줄에서 멈추고, 정점에서 조여지는 건 엉덩이여야 한다."},{k:"bridgeStages",cap:"무게 없이 강도를 올리는 순서. 1단계 양발 12회 → 2단계 무릎에 밴드를 끼우고 정점에서 10초 홀드 → 3단계 한 다리. 각 단계를 2주씩, 허리가 안 아프고 엉덩이가 조여지면 다음 단계로. 4단계에서야 덤벨을 골반 위에 올린다."}]},
  hipAbduction:{n:"힙 어브덕션(머신)",d:"3세트 15회",sets:3,weighted:true,w:"앉아서 무릎을 바깥으로 벌리는 머신. 엉덩이 옆 근육을 키워 힙 라인의 위쪽·옆쪽을 만듭니다.",s:["머신에 앉아 등을 등받이에 붙이고 패드에 무릎 바깥을 댄다.","엉덩이 옆이 조여지는 느낌으로 벌리고 1초 멈춘다.","천천히 되돌린다. 무게가 쿵 떨어지지 않게.","15회 3세트. 상체를 살짝 앞으로 기울이면 자극이 더 잘 온다."],c:"반동으로 벌리지 않는다."},
  innerThigh:{n:"이너싸이(내전근 머신)",d:"3세트 15회",sets:3,weighted:true,w:"앉아서 무릎을 안으로 모으는 머신. 약한 내전근을 직접 강화합니다. 머신이 없으면 옆으로 누워 아래쪽 다리를 드는 동작으로 대체.",s:["머신에 앉아 패드에 무릎 안쪽을 대고 다리를 벌린 상태에서 시작.","허벅지 안쪽 힘으로 천천히 모으고 1초 멈춘다.","천천히 벌리며 되돌린다. 15회 3세트.","대체 동작, 옆으로 누워 위쪽 다리는 앞에 두고 아래쪽 다리를 천장으로 든다."],c:"가벼운 무게로 시작. 사타구니가 찌릿하면 가동범위를 줄인다. 지난번 근육통이 아직 남아 있으면 무게를 절반으로, 통증이 완전히 가신 뒤에 원래 무게로 돌아간다."},
  latPulldown:{n:"랫풀다운",d:"3세트 12회",sets:3,weighted:true,w:"위에서 바를 가슴 쪽으로 당기는 머신. 등 전체를 강화해 자세를 세우는 힘을 만듭니다.",s:["바를 어깨보다 약간 넓게 잡고 앉는다.","가슴을 살짝 들고, 팔꿈치를 아래로 내린다는 느낌으로 바를 쇄골 쪽까지 당긴다.","날개뼈가 아래로 모이는 걸 느끼고 천천히 올린다.","12회 3세트. 목 뒤로 당기지 않는다."],c:"어깨가 으쓱 올라간 채 팔 힘으로만 당기지 않기. 목디스크 기질이 있으므로 목 뒤로 당기는 변형은 금지."},
  seatedRow:{n:"시티드로우",d:"3세트 12회",sets:3,weighted:true,w:"앉아서 손잡이를 배 쪽으로 당기는 머신. 등 중부와 날개뼈 사이를 강화하는 라운드숄더 교정 운동.",s:["가슴 패드나 발판에 자세를 잡고 손잡이를 잡는다.","허리를 세운 채 팔꿈치를 뒤로 빼며 배꼽 쪽으로 당긴다.","날개뼈를 모으고 1초, 천천히 되돌린다.","12회 3세트."],c:"허리를 뒤로 눕히며 반동으로 당기지 않는다."},
  birdDog:{n:"버드독",d:"양쪽 10회씩 3세트",sets:3,w:"네발기기에서 반대쪽 팔과 다리를 뻗는 동작. 허리를 움직이지 않고 버티는 코어를 만들어 협착이 있는 허리에 특히 적합합니다.",s:["네발기기 자세. 허리는 평평하게.","오른팔을 앞으로, 왼다리를 뒤로 바닥과 평행하게 뻗는다.","허리가 처지거나 골반이 기울지 않게 3초 버틴다.","제자리로 돌아와 반대쪽. 양쪽 10회가 1세트."],c:"다리를 높이 드는 게 목표가 아니다. 골반이 수평인 높이까지만."},
  deadBug:{n:"데드버그",d:"양쪽 10회씩 3세트",sets:3,w:"누워서 반대쪽 팔다리를 천천히 내리는 동작. 허리를 바닥에 붙인 채 버티는 코어 운동으로 버드독과 같은 목적.",s:["누워서 팔은 천장으로, 무릎은 90도로 든다.","허리를 바닥에 지그시 붙인 상태를 유지하며 오른팔과 왼다리를 천천히 바닥 쪽으로 내린다.","허리가 뜨려는 직전에 멈추고 되돌아온다.","반대쪽과 번갈아 양쪽 10회가 1세트."],c:"허리가 바닥에서 뜨면 가동범위를 줄인다.",figs:[{k:"deadBug",cap:"허리를 바닥에 붙인 채 반대쪽 팔과 다리를 천천히 멀어지게 한다. 허리가 뜨려는 직전이 멈추는 지점이다. 회색이 제자리, 초록이 움직이는 쪽."}]},
  gobletSquat:{n:"고블릿 스쿼트",d:"3세트 10회",sets:3,weighted:true,w:"케틀벨을 가슴 앞에 안고 하는 스쿼트. 무게가 앞에 있어 상체가 저절로 서고 허리 부담이 적습니다.",s:["케틀벨 손잡이 양옆을 잡아 가슴 앞에 밀착.","발은 어깨너비보다 약간 넓게, 발끝은 살짝 바깥.","엉덩이를 뒤로 빼며 무릎이 발끝 방향을 따라가도록 앉는다. 허벅지가 바닥과 평행 근처까지.","발 전체로 바닥을 밀며 일어나고, 꼭대기에서 엉덩이를 조인다.","10회 3세트. 무릎이 안으로 모이려 하면 그게 내전근·중둔근 약화 신호이니 가볍게."],c:"내려갈 때 무릎이 안쪽으로 무너지지 않게. 통증 없는 깊이까지만."},
  kbDeadlift:{n:"케틀벨 루마니안 데드리프트(RDL)",d:"3세트 10회",sets:3,weighted:true,w:"케틀벨을 든 채 엉덩이를 뒤로 밀어 상체를 눕혔다가 엉덩이로 일어서는 동작. 바닥까지 내려가지 않고 정강이 중간까지만 갑니다. 둔근 아래쪽과 햄스트링, 즉 엉덩이와 허벅지의 경계선을 만드는 운동이라 힙업에 직접 관여합니다.",s:["케틀벨을 양손으로 들고 발은 골반 너비로 선다. 세 점으로 바닥을 누른다.","무릎을 살짝 굽힌 채 고정하고, 엉덩이를 뒤로 밀며 상체를 숙인다. 케틀벨은 다리에 붙여 내려간다.","등은 꼬리뼈부터 뒤통수까지 한 줄. 정강이 중간쯤에서 햄스트링이 당기면 멈춘다.","엉덩이를 앞으로 밀며 일어선다. 선 자세에서 엉덩이를 조이되 허리를 젖히지 않는다.","10회 3세트. 가벼운 무게로 형태부터."],c:"등이 말리면 안 된다. 거울 옆모습으로 확인. 허리에 찌릿함이 오면 즉시 중단. 브릿지에서 엉덩이 느낌을 잡기 전에는 무게를 올리지 않는다.",figs:[{k:"hinge",cap:"무릎을 굽혀 앉는 것이 아니라 엉덩이를 뒤로 밀어 상체를 눕히는 동작이다. ✕ 등이 굽으면 그 힘이 그대로 디스크로 간다. ○ 꼬리뼈부터 뒤통수까지 한 줄을 유지한 채 엉덩이만 뒤로 보낸다. 정강이는 거의 수직으로 둔다."}]},
  stepUp:{n:"스텝박스 스텝업",d:"양쪽 10회씩 3세트",sets:3,weighted:true,w:"박스에 한 발을 올리고 그 발의 힘만으로 올라서는 동작. 둔근과 다리를 동시에 강화합니다. 아령을 들면 무게란에 기록.",s:["박스 앞에 서서 오른발 전체를 박스 위에 올린다. 발이 반쯤 걸치면 안 된다.","오른발 뒤꿈치로 박스를 눌러 몸을 끌어올린다. 뒤에 남은 왼발로 차고 오르지 않는 게 핵심.","박스 위에서 골반을 완전히 펴고 잠깐 선다.","오른발에 힘을 유지한 채 천천히 왼발부터 내려온다.","오른쪽 10회를 다 하고 왼쪽 10회. 이것이 1세트, 3세트."],c:"올라설 때 무릎이 안쪽으로 무너지지 않게 발끝 방향과 무릎 방향을 맞춘다. 상체를 과하게 숙이지 않는다."},
  bulgarian:{n:"불가리안 스플릿 스쿼트",d:"양쪽 8회씩 2세트",sets:2,weighted:true,w:"뒷발을 벤치에 올리고 앞다리로 앉았다 일어나는 동작. 둔근 자극이 크고 좌우 불균형 교정에 좋습니다. 무게 없이 시작.",s:["벤치를 등지고 서서 한 발등을 벤치에 올린다. 앞발은 크게 한 걸음 앞에.","처음에는 손으로 벽이나 봉을 잡고 균형을 잡는다.","상체를 살짝 숙이며 앞다리 엉덩이에 체중을 싣고 수직으로 내려간다.","앞발 뒤꿈치로 밀며 일어난다. 양쪽 8회씩이 1세트, 2세트."],c:"앞 무릎이 안으로 무너지거나 발끝보다 과하게 나가지 않게. 균형이 어려우면 잡을 것을 꼭 둔다."},
  hang:{n:"철봉 매달리기",d:"15초 4세트",sets:4,timed:{work:15,rest:45},w:"그냥 매달려 있는 것만으로 척추가 늘어나고 어깨가 열리며 악력이 강해집니다. 협착에도 좋은 감압 효과. 타이머가 15초 매달리기와 45초 휴식을 안내합니다.",s:["철봉을 어깨너비로 잡고 발을 뗀다.","어깨에 귀가 닿을 듯 축 늘어져도 되고, 여유가 되면 날개뼈를 살짝 끌어내려 본다.","15초 버티고 내려와 쉬기를 4회."],c:"손 저림이 심해지면 시간을 줄인다. 뛰어내리지 말고 살짝 내려온다."},
  walk:{n:"산책",d:"15~20분",sets:1,w:"트레드밀 걷기와 같은 역할. 턱을 당기고 시선은 멀리, 팔을 가볍게 흔들며 평소보다 약간 빠르게.",s:["처음 3분은 편하게, 이후에는 대화가 가능하지만 노래는 어려운 정도의 속도로.","걸으면서 어깨를 뒤로 한 번씩 굴려준다."],c:""},
  treadmill:{n:"트레드밀 걷기(준비운동)",d:"5분, 속도 5.5~6",sets:1,w:"하던 대로 하시면 됩니다. 본운동 전 몸을 데우는 용도로 5분이면 충분합니다.",s:["속도 5.5~6으로 5분.","턱 당기고 화면보다 시선을 멀리 둔다."],c:""},
  stretch:{n:"유튜브 폼롤러 스트레칭",d:"10~20분",sets:1,w:"기존에 하시던 것을 그대로. 이미 잘 하고 계신 습관이므로 루틴의 마무리로 유지합니다.",s:[],c:"허리를 과하게 젖히는 동작이 나오면 그 동작만 건너뛴다."},
  lacrosseLight:{n:"라크로스볼 가볍게",d:"10분 이내",sets:1,w:"마사지 탭의 구성 중 가슴, 발바닥, 목어깨만 골라 가볍게. 완전 휴식일의 선택 사항입니다.",s:[],c:""},
  /* 2026-09 개편: 등 운동 대체, 골반·발, 이동 중 */
  chestRow:{n:"체스트 서포티드 덤벨 로우",d:"3세트 12회",sets:3,weighted:true,w:"경사 벤치에 가슴을 대고 엎드려 덤벨을 당기는 동작. 몸이 받쳐져 있어 허리 부담이 없고 반동이 불가능하며, 어깨가 힘을 뺄 수 있습니다. 랫풀다운과 시티드로우에서 허리가 아프고 어깨에 힘이 들어가던 문제를 구조적으로 막아주는 등 운동입니다.",s:["벤치를 30~45도로 세우고 가슴을 대고 엎드린다. 발은 바닥.","양손에 덤벨을 들고 팔을 늘어뜨린다. 어깨는 귀에서 멀리.","팔꿈치를 뒷주머니에 넣는다는 느낌으로 뒤로 당긴다. 날개뼈가 모이는 걸 느끼고 1초.","천천히 내린다. 12회 3세트."],c:"덤벨을 위로 드는 게 아니라 팔꿈치를 뒤로 보내는 것. 어깨가 으쓱 올라가면 무게를 줄인다.",figs:[{k:"chestRow",cap:"가슴이 벤치에 받쳐져 있으니 허리가 일할 수 없고 반동도 불가능하다. 회색이 시작 자세, 초록이 당긴 자세. 손을 올리는 게 아니라 팔꿈치를 뒤로 보낸다."}]},
  oneArmRow:{n:"원암 덤벨 로우",d:"3세트 10회 좌우",sets:3,weighted:true,w:"벤치에 한 손과 한 무릎을 대고 반대 손으로 덤벨을 당기는 동작. 한쪽씩 하니 좌우 차이가 드러나고, 상체가 벤치에 지지되어 허리가 편합니다.",s:["벤치에 왼 무릎과 왼손을 대고 등을 바닥과 평행하게 편다. 오른발은 바닥.","오른손 덤벨을 늘어뜨린다. 어깨를 바닥 쪽으로 늘어뜨려 등을 늘인다.","팔꿈치를 골반 옆으로 당긴다. 몸통은 비틀지 않는다. 1초 멈추고 천천히 내린다.","10회 후 반대쪽. 좌우 10회씩이 1세트, 3세트."],c:"몸통을 비틀어 당기면 허리로 간다. 등은 한 줄 유지. 약한 쪽이 있으면 그쪽을 먼저.",figs:[{k:"oneArmRow",cap:"한 손과 한 무릎으로 벤치를 짚어 상체를 받친다. 등은 바닥과 평행한 한 줄. 팔꿈치가 골반 옆으로 올 때까지 당기되 몸통은 비틀지 않는다."}]},
  facePull:{n:"밴드 페이스풀",d:"2세트 15회",sets:2,w:"밴드를 얼굴 쪽으로 당기며 팔꿈치를 벌리는 동작. 어깨 뒤쪽과 외회전근, 하부 승모근을 함께 씁니다. 어깨 앞쪽 타이트함과 어깨 으쓱 습관을 동시에 잡는 라운드숄더 교정 운동입니다.",s:["밴드를 얼굴 높이에 고정하고(문이나 기둥) 양손으로 잡는다.","팔꿈치를 높이 들고 밴드를 얼굴 쪽으로 당긴다. 끝에서 양손이 귀 옆에 온다.","날개뼈가 모이고 어깨가 뒤로 열리는 느낌. 1초 멈춘다.","천천히 돌아간다. 15회 2세트."],c:"허리를 젖혀 당기지 않는다. 어깨가 올라가면 밴드 장력을 줄인다."},
  hip9090:{n:"90/90 힙 스트레치",d:"좌우 1분",sets:2,setLbl:["왼쪽","오른쪽"],timed:{work:60,rest:0},w:"바닥에 앉아 앞다리와 뒷다리를 각각 90도로 접는 자세. 앞다리는 바깥 회전, 뒷다리는 안쪽 회전이 동시에 늘어납니다. 오른쪽 고관절이 안으로 잘 안 돌아가는 문제를 겨냥합니다. 앉아서 굽히는 자세라 협착에 안전합니다.",s:["앉아서 오른다리를 앞에 90도, 왼다리를 옆으로 90도 접는다. 양쪽 무릎 모두 90도.","골반을 세우고 앞 무릎 쪽으로 상체를 살짝 숙인다. 앞다리 엉덩이 바깥이 당긴다.","1분 후 반대쪽. 뒷다리가 안쪽으로 돌아가는 쪽(오른쪽)이 뻣뻣하면 거기서 10초 더."],c:"무릎이 아프면 각도를 줄인다. 반동 없이 숨을 내쉬며 늘린다."},
  sideBridgeKnee:{n:"무릎 사이드 브릿지",d:"좌우 20초 2세트",sets:2,setLbl:["왼쪽","오른쪽"],timed:{work:20,rest:10},w:"옆으로 누워 팔꿈치와 무릎으로 지지하고 골반을 들어 올리는 동작. 옆구리 코어와 중둔근이 골반을 잡아줍니다. 협착이 있는 허리에 안전한 코어 운동으로 꼽힙니다.",s:["옆으로 누워 팔꿈치를 어깨 바로 아래에 두고 무릎을 90도로 접는다.","골반을 들어 어깨-골반-무릎이 한 줄이 되게 한다.","위쪽 엉덩이를 조인 채 20초. 골반이 뒤로 넘어가지 않게.","반대쪽. 좌우가 1세트, 2세트."],c:"어깨가 아프면 팔꿈치 위치를 다시 잡는다. 골반이 처지면 시간을 줄인다.",figs:[{k:"sideBridge",cap:"팔꿈치는 어깨 바로 아래, 무릎은 바닥. 골반을 들어 어깨-골반-무릎이 한 줄. 골반이 처지거나 뒤로 넘어가면 시간을 줄인다."}]},
  doorStretch:{n:"문틀 가슴 스트레칭",d:"30초",sets:1,timed:{work:30,rest:0},w:"문틀에 팔을 대고 한 발 앞으로 나가 가슴 앞쪽을 여는 스트레칭. 어깨 앞이 타이트한 것에 가장 직접적이고, 사무실에서 30초면 됩니다. 11시·15시에 일어나서 할 것으로 정해 두면 좋습니다.",s:["문틀에 양 팔꿈치를 어깨 높이로 대고 선다.","한 발을 앞으로 내디디며 가슴을 앞으로 보낸다. 허리가 아니라 가슴이 나간다.","가슴 앞이 당기는 지점에서 30초 호흡."],c:"허리를 젖혀서 가슴을 내밀지 않는다. 갈비뼈는 내린 채. 손 저림이 오면 팔꿈치를 낮춘다."},
  shortFoot:{n:"앉아서 아치 세우기",d:"5초 10회",sets:1,w:"발가락을 구부리지 않고 발바닥 아치만 살짝 들어 올리는 동작. 낮은 아치를 안쪽에서 받쳐주는 발 속 근육을 깨웁니다. 앉은 채로 티 나지 않게 되고, 버스나 지하철에서 하기 좋습니다.",s:["앉아서 발을 바닥에 평평하게 두고 발가락을 편다.","발가락은 그대로 편 채, 엄지발가락 뿌리를 뒤꿈치 쪽으로 끌어당긴다는 느낌으로 아치를 들어 올린다. 발이 아주 조금 짧아진다.","5초 유지, 힘을 뺀다. 10회. 발가락이 구부러지면 다시.","익숙해지면 서서, 그다음 한 발로."],c:"발가락을 오므리는 게 아니다. 종아리에 쥐가 나면 힘을 줄인다.",figs:[{k:"foot",cap:"왼쪽: 서고 걷고 운동할 때 발이 바닥을 누르는 세 점 — 뒤꿈치, 엄지 아래, 새끼 아래. 이 세 점을 유지하면 아치가 무너지지 않는다. 오른쪽: 아치 세우기. 발가락은 편 채로 엄지 뿌리를 뒤꿈치 쪽으로 당겨 발 가운데를 살짝 띄운다."}]},
  heelRaise:{n:"뒤꿈치 들기",d:"15회",sets:1,w:"서서 뒤꿈치를 천천히 들었다 내리는 동작. 종아리와 함께 아치를 안쪽에서 당겨 올리는 근육(후경골근)이 강해집니다. 신호 대기, 엘리베이터, 버스 안에서.",s:["발을 골반 너비로, 발끝은 정면.","엄지발가락 아래로 바닥을 누르며 뒤꿈치를 든다. 발이 바깥으로 기울지 않게.","꼭대기에서 1초, 천천히 내린다. 15회."],c:"발목이 바깥으로 꺾이면 새끼발가락 쪽으로 체중이 가는 것이니 엄지 쪽으로 다시."},
  commuteWalk:{n:"출퇴근 걷기",d:"편도 30~35분",sets:2,setLbl:["출근","퇴근"],w:"회사와 집 사이 30~35분을 걷는 것이 이 계획의 유산소 전부입니다. 왕복이면 하루 65분, 주 5일이면 5시간이 넘습니다. 걷기 자세 연습 시간이기도 합니다. 최소 기준은 퇴근길만.",s:["발끝 정면, 두 발 사이 간격은 좁게. 뒷발로 밀고 그쪽 엉덩이가 조여지는지 느낀다.","팔은 뒤로. 시선은 10~15m 앞.","20~30분에 한 번, 5초만 앞으로 굽힌다.","출장으로 못 걷는 날은 이동 중 루틴으로 대체. 죄책감 없이."],c:"아침 첫걸음에 뒤꿈치가 찌르듯 아프거나 정강이 안쪽이 아프면 아치가 버티지 못하는 신호. 인솔부터 챙기고 편도만으로 줄인다."},
  /* 루틴 R, 내전근이 뭉쳤을 때 사무실에서 푸는 동작 */
  reliefWalk:{n:"복도 걷기 리셋",d:"2~3분",sets:1,w:"뭉친 내전근에 가장 잘 듣는 것은 세게 늘리는 스트레칭이 아니라 자주 걷는 것입니다. 혈류가 늘면서 근육통이 빨리 가라앉고, 다리가 바깥으로 흐르는 걸음도 제자리를 찾습니다.",s:["한 시간에 한 번, 복도나 계단참을 2~3분 걷는다.","발끝은 정면, 보폭은 평소보다 좁게. 두 발이 한 줄 위를 지나간다는 느낌으로.","뒤꿈치가 먼저 닿고 엄지발가락으로 밀어내는 순서를 지킨다.","걷는 동안 무릎이 바깥으로 벌어지지 않는지 한 번씩 확인한다."],c:"절뚝일 정도면 한 번에 오래 걷지 말고 짧게 여러 번으로 나눈다."},
  reliefSqueeze:{n:"약하게 조였다 풀기",d:"5초 조이고 10초 풀기 5회",sets:5,timed:{work:5,rest:10},ph:{w:"조이기",r:"풀기"},w:"뭉친 날의 링 조이기 대체 동작. 힘껏 조이는 게 목적이 아니라, 약하게 조인 뒤 완전히 푸는 감각을 반복해 방어적으로 굳은 근육을 내려놓게 하는 것이 목적입니다.",s:["의자에 바르게 앉아 무릎 사이에 주먹이나 접은 수건을 끼운다.","최대 힘의 20~30%로만 5초 조인다. 아프면 더 약하게.","10초 동안 완전히 힘을 뺀다. 조이는 쪽보다 푸는 쪽이 중요하다.","5회 반복."],c:"통증이 있는 날 20초 강하게 조이는 원래 동작은 하지 않는다. 사타구니가 찌릿하면 즉시 중단."},
  reliefOpen:{n:"앉아서 무릎 벌려 이완",d:"5초 밀고 20초 이완 3회",sets:3,timed:{work:5,rest:20},ph:{w:"밀기",r:"이완"},w:"근육은 한 번 수축한 직후에 더 잘 이완됩니다. 억지로 늘리는 정적 스트레칭보다 뭉친 근육에 안전한 방식입니다.",s:["두 발을 바닥에 두고 앉아 무릎을 편하게 벌린다. 당기기 직전까지만.","양손을 무릎 안쪽에 대고, 무릎으로 손을 20~30% 힘으로 5초 민다. 손은 버텨준다.","힘을 빼고 숨을 내쉬며 20초 이완한다. 벌어지는 만큼만 벌어지게 둔다.","3회 반복."],c:"반동을 주거나 손으로 무릎을 눌러 벌리지 않는다. 당김이 통증으로 바뀌면 각도를 줄인다."},
  reliefPress:{n:"허벅지 안쪽 쓸어주기",d:"양쪽 30초씩",sets:2,setLbl:["왼쪽","오른쪽"],timed:{work:30,rest:10},w:"손이나 공으로 허벅지 안쪽을 지그시 눌러 쓸어주는 이완. 앉은 채로 티 나지 않게 할 수 있습니다.",s:["손바닥이나 주먹 면을 허벅지 안쪽 한가운데에 댄다.","무릎 쪽에서 사타구니 쪽으로 지그시 쓸어 올린다. 한 번에 3~4초씩 30초간.","특히 뭉친 지점은 그 자리에서 10초 지그시 누르며 숨을 내쉰다.","공을 쓸 경우 의자에 눌러 굴리지 말고 손으로 잡고 압력을 조절한다."],c:"사타구니 바로 아래 오목한 곳에는 혈관과 신경이 지나므로 세게 누르지 않는다. 멍이 들 정도의 압력은 오히려 회복을 늦춘다."},
  reliefSideShift:{n:"책상 잡고 옆으로 체중 옮기기",d:"양쪽 6회씩",sets:2,setLbl:["왼쪽","오른쪽"],w:"선 자세에서 좌우로 체중을 옮기며 내전근을 천천히 늘렸다 줄였다 하는 동적 이완. 굳어 있던 근육을 원래 길이로 되돌립니다.",s:["책상이나 벽을 잡고 다리를 어깨너비보다 넓게 벌리고 선다.","한쪽 무릎을 살짝 굽히며 그쪽으로 체중을 옮긴다. 반대쪽 허벅지 안쪽이 당기기 직전에서 멈춘다.","2초 머물렀다가 반대쪽으로 옮긴다. 좌우 6회씩.","무릎은 항상 발끝과 같은 방향을 본다."],c:"깊게 앉지 않는다. 스트레칭이 아니라 통과하는 동작이라고 생각한다."},
  intervalWalk:{n:"경사 걷기 인터벌",d:"1분 오르막 + 2분 회복, 5세트",sets:5,timed:{work:60,rest:120},ph:{w:"오르막",r:"회복"},w:"속도가 아니라 경사를 올려 심박수를 끌어올리는 저충격 인터벌입니다. 경사에서는 몸이 자연스럽게 앞으로 기울어 협착이 있는 허리가 오히려 편해지고, 뛰지 않으므로 착지 충격이 척추와 목으로 가지 않습니다. 심폐지구력은 달리기가 아니어도 충분히 올라갑니다. 타이머가 1분 오르막과 2분 회복을 자동으로 번갈아 안내합니다.",s:["웜업 3분. 경사 0~2%, 속도 5.5로 걷는다.","오르막 1분. 경사 8~10%로 올리고 속도는 5.5~6 그대로 둔다. 올리는 것은 속도가 아니라 경사다.","회복 2분. 경사 0~1%, 속도 4.5로 낮춰 숨을 고른다.","5세트 반복. 여기까지 13분.","쿨다운 3분. 경사 0, 속도 4.0으로 마무리. 전체 19분."],c:"처음 4주는 심박수 145를 넘기지 않는다. 짧은 문장은 말할 수 있지만 대화는 힘든 정도면 충분하다. 오르막에서 손잡이를 꽉 잡고 상체를 뒤로 젖히면 허리가 펴지며 협착에 나쁘므로, 손은 가볍게 얹거나 놓는다. 다리가 저리거나 무거워지면 그 세트에서 멈추고 앉는다."},
  bow108:{n:"108배",d:"36배씩 3세트",sets:3,setLbl:["1~36","37~72","73~108"],w:"절은 스쿼트와 플랭크와 호흡이 한 동작 안에 들어 있는 전신 운동입니다. 15~20분에 심박수가 오르고 하체 근지구력과 코어가 함께 좋아집니다. 협착이 있는 허리에는 굽히는 방향의 동작이라 대체로 편한 편입니다. 처음 2주는 1세트(36배)만 하고, 근육통이 이틀 안에 가시면 한 세트씩 늘립니다.",s:["무릎이 닿을 자리에 절 방석이나 접은 이불을 반드시 깐다. 맨바닥에서 108번은 무릎이 견디지 못한다.","내려갈 때 무릎부터 꺾지 말고 엉덩이를 뒤로 빼며 앉아 손을 먼저 짚는다. 무릎이 바닥에 툭 떨어지지 않게 손으로 체중을 나눠 받는다.","무릎을 꿇을 때 무릎 사이는 골반 너비로. 넓게 벌리면 내전근이 길게 늘어난다.","숨은 내려가며 내쉬고 올라오며 마신다. 반동으로 튕겨 일어나지 않는다.","일어설 때는 가슴을 먼저 세우고 머리는 마지막에 든다. 머리부터 홱 드는 것이 목에 가장 나쁘다.","1배에 6~8초, 36배에 4~5분. 염주나 계수기로 세면 숫자에 신경 쓰지 않아도 된다."],c:"기상 직후 한 시간 안에는 하지 않는다. 자고 일어난 척추는 물을 머금고 있어 굽히는 동작에 가장 약하다. 다리 저림이나 손 저림이 심해지면 그날은 중단한다. 무릎이 아프면 배 수를 줄이고 방석을 더 두껍게.",figs:[{k:"bowDown",cap:"무릎부터 꺾어 털썩 앉지 않는다. 엉덩이를 뒤로 빼며 앉아 손을 먼저 바닥에 짚고, 그 손으로 체중을 나눠 받으면서 무릎을 내려놓는다. 무릎 사이는 골반 너비로."},{k:"bowUp",cap:"일어설 때 머리부터 홱 드는 것이 목에 가장 나쁘다. 한 번의 습관이 108번 반복된다. 가슴을 먼저 세우고 머리는 척추 연장선을 따라 마지막에 올라온다."}]},
  reliefHeat:{n:"허벅지 안쪽 온찜질",d:"10~15분",sets:1,w:"운동 다음 날부터 남는 뭉침에는 냉찜질보다 온찜질입니다. 근육이 이완되고 혈류가 늘어 뻣뻣함이 줄어듭니다.",s:["핫팩이나 따뜻한 물을 담은 텀블러를 옷 위에 대고 허벅지 안쪽을 10~15분 데운다.","자리에 앉아 일하면서 그대로 두어도 된다.","데운 직후에 위의 이완 동작을 하면 훨씬 잘 풀린다."],c:"맨살에 직접 대지 않는다. 붓기나 열감이 있고 한 지점이 콕 아프면 온찜질보다 진료가 먼저다."}
};

const ROUTINES = {

  {h:"앉은 자세",items:[
    "카피스코는 세 자세를 돌아가며 앉는 의자다. 기본은 안장 자세: 시트를 올려 고관절이 무릎보다 높게, 다리를 벌려 앞으로 앉는다. 골반이 저절로 서고 다리를 꼴 수 없는 구조라, 다리 꼬는 습관은 따로 고치는 게 아니라 이 자세가 고친다.",
    {fig:"capisco",cap:"1 안장 — 시트를 올려 고관절이 무릎보다 높게. 협착에 가장 편한 앉기이고 케겔도 이 자세에서 잘 된다. 2 등받이 앞으로 — 의자를 돌려 등받이를 가슴에 대고 앉는다. 라운드숄더가 물리적으로 막힌다. 3 반 서기 — 시트를 최대로 올려 엉덩이만 걸친다. 40분마다 하나씩 바꾼다."},
    "40분마다 자세를 바꾼다. 앉아 있는 동안의 보조이고, 일어나기의 대체는 아니다.",

    "일반 의자에 앉을 때는 양반다리 대신 두 발을 바닥에 두고 무릎 사이에 링이나 접은 수건. 양반다리는 내전근을 더 늘리고 골반 틀어짐을 심화시킨다.",

  {h:"서 있는 자세",items:[

function dateKey(dayIdx,weekOff){

}

let AC=null;
function beep(freq,dur,delay){
  if(S.mute)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.25,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sndStart(){beep(880,0.15);}
function sndWork(){beep(880,0.12);beep(880,0.12,0.18);}
function sndRest(){beep(440,0.3);}
function sndSeg(){beep(740,0.18);}
function sndDone(){beep(660,0.12);beep(880,0.12,0.16);beep(1100,0.3,0.32);}

}

function figHTML(f){return '<figure class="fig">'+FIGS[f.k]+(f.cap?'<figcaption>'+f.cap+'</figcaption>':'')+'</figure>';}

  if(e.c)h+='<div class="cau">'+e.c+'</div>';
  return h;
}
function setKey(dk,key){return dk+"|"+key;}
function getSets(dk,key){const a=S.sets[setKey(dk,key)];const n=EX[key].sets;const r=Array.isArray(a)?a.slice(0,n):[];while(r.length<n)r.push(false);return r;}
function getWeights(dk,key){const a=S.weights[setKey(dk,key)];const n=EX[key].sets;const r=Array.isArray(a)?a.slice(0,n):[];while(r.length<n)r.push("");return r;}

/* ---------- 세트 타이머 ---------- */
let T={id:null,el:null};
function stopExTimer(msg){
  if(T.id){clearInterval(T.id);T.id=null;}
  if(T.el){
    const b=T.el.querySelector("[data-extimer]"),d=T.el.querySelector(".tdisp"),p=T.el.querySelector(".tphase");
    if(b)b.textContent="세트 타이머 시작";
    if(d)d.textContent="--";
    if(p){p.textContent=msg||"";p.className="tphase";}
  }
  T.el=null;
}
function startExTimer(exDiv){
  stopExTimer();
  const key=exDiv.dataset.ex,dk=exDiv.dataset.dk,e=EX[key];
  let sets=getSets(dk,key);
  let idx=sets.findIndex(v=>!v);
  if(idx<0){flashPhase(exDiv,"모든 세트 완료");return;}
  T.el=exDiv;
  const btn=exDiv.querySelector("[data-extimer]"),disp=exDiv.querySelector(".tdisp"),ph=exDiv.querySelector(".tphase");
  btn.textContent="중지";
  let phase="work",remain=e.timed.work;
  const paint=()=>{
    disp.textContent=remain+"초";
    const pl=e.ph||{};
    ph.textContent=(phase==="work"?(pl.w||"진행")+" · 세트 "+(idx+1)+"/"+e.sets:(pl.r||"휴식"));
    ph.className="tphase "+phase;
  };
  paint();
  sndWork();
  T.id=setInterval(()=>{
    remain--;
    if(remain<=0){
      if(phase==="work"){
        sets=getSets(dk,key);sets[idx]=true;S.sets[setKey(dk,key)]=sets;saveState();
        refreshSetRow(exDiv);
        if(idx+1>=e.sets||e.timed.rest===0&&idx+1>=e.sets){sndDone();stopExTimer("완료, 수고하셨습니다");return;}
        if(e.timed.rest>0){phase="rest";remain=e.timed.rest;sndRest();}
        else{idx++;phase="work";remain=e.timed.work;sndWork();}
      }else{
        idx++;
        if(idx>=e.sets){sndDone();stopExTimer("완료, 수고하셨습니다");return;}
        phase="work";remain=e.timed.work;sndWork();
      }
    }
    paint();
  },1000);
}
function flashPhase(exDiv,msg){
  const ph=exDiv.querySelector(".tphase");
  if(ph){ph.textContent=msg;ph.className="tphase";}
}
function refreshSetRow(exDiv){
  const key=exDiv.dataset.ex,dk=exDiv.dataset.dk;
  const sets=getSets(dk,key);
  exDiv.querySelectorAll(".setrow button").forEach((b,i)=>b.classList.toggle("done",!!sets[i]));
  const prog=exDiv.querySelector(".prog");
  const t=progText(dk,key);
  if(prog)prog.textContent=t;
  else if(t){
    const sp=document.createElement("span");sp.className="prog";sp.textContent=t;
    exDiv.querySelector(".ex-head .d").before(sp);
  }
}

function bindEx(scope){
  scope.querySelectorAll(".ex").forEach(exDiv=>{

      head.querySelector(".arrow").textContent=exDiv.classList.contains("open")?"▾":"▸";

    if(!dk)return;
    exDiv.querySelectorAll(".setrow button").forEach(b=>{
      b.onclick=ev=>{
        ev.stopPropagation();
        const i=+b.dataset.set;
        const sets=getSets(dk,key);sets[i]=!sets[i];S.sets[setKey(dk,key)]=sets;saveState();
        refreshSetRow(exDiv);renderGoals();

    });
    exDiv.querySelectorAll("[data-wset]").forEach(inp=>{
      inp.onchange=()=>{
        const ws=getWeights(dk,key);ws[+inp.dataset.wset]=inp.value;S.weights[setKey(dk,key)]=ws;saveState();
      };
    });
    const memo=exDiv.querySelector("[data-memo]");
    if(memo)memo.onchange=()=>{const v=memo.value.trim();if(v)S.notes[setKey(dk,key)]=v;else delete S.notes[setKey(dk,key)];saveState();};
    const tb=exDiv.querySelector("[data-extimer]");
    if(tb)tb.onclick=ev=>{
      ev.stopPropagation();
      if(T.el===exDiv&&T.id)stopExTimer();
      else startExTimer(exDiv);
    };
  });
}

let mT=null,mSeg=0,mRemain=0;
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function hlSeg(i){document.querySelectorAll("#massageTable tbody tr").forEach((tr,j)=>tr.classList.toggle("now",j===i));}
$("#timerBtn").onclick=()=>{
  if(mT){clearInterval(mT);mT=null;$("#timerBtn").textContent="타이머 시작";$("#segName").textContent="";$("#clock").textContent="0:00";hlSeg(-1);return;}
  mSeg=0;mRemain=MASSAGE[0].sec;
  $("#timerBtn").textContent="중지";
  sndStart();
  const tick=()=>{
    $("#clock").textContent=fmt(mRemain);
    $("#segName").textContent=MASSAGE[mSeg].part;
    hlSeg(mSeg);
    if(mRemain<=0){
      mSeg++;
      if(mSeg>=MASSAGE.length){sndDone();clearInterval(mT);mT=null;$("#timerBtn").textContent="타이머 시작";$("#segName").textContent="완료, 수고하셨습니다";hlSeg(-1);return;}
      mRemain=MASSAGE[mSeg].sec;sndSeg();
    }else mRemain--;
  };
  tick();mT=setInterval(tick,1000);
};

function normalizeState(){
  ["checks","sets","weights","notes","cond","meal","extra"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={};});
  /* 이전 버전의 relief(내전근 풀기 토글)를 extra 형식으로 옮긴다 */
  if(S.relief&&typeof S.relief==="object"){Object.keys(S.relief).forEach(dk=>{if(S.relief[dk]){const a=S.extra[dk]||[];if(!a.includes("R"))a.push("R");S.extra[dk]=a;}});delete S.relief;}
  if(!S.goal||typeof S.goal!=="object")S.goal={};
  if(!(S.goal.bridge>=1&&S.goal.bridge<=4))S.goal.bridge=1;
  if(!Array.isArray(S.inbody)||!S.inbody.length)S.inbody=INBODY_SEED.slice();
}
function applyImport(txt){
  let p=null;
  try{p=JSON.parse(txt);}catch(e){}
  if(!p||typeof p!=="object"||(!p.checks&&!p.sets&&!p.inbody)){alert("운동 기록 백업이 아닌 것 같습니다. 내용을 확인해 주세요.");return;}
  if(!confirm("현재 기록을 이 백업 내용으로 덮어씁니다. 계속할까요?"))return;
  S={checks:{},sets:{},weights:{},notes:{},cond:{},meal:{},extra:{},goal:{bridge:1},inbody:null};
  Object.assign(S,p);normalizeState();
  saveState();renderDays();renderPlan();renderRecord();
  alert("복원했습니다.");
}
function bindBackup(){
  $("#bkDown").onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="운동기록_"+dateKey(new Date().getDay())+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  $("#bkFileBtn").onclick=()=>$("#bkFile").click();
  $("#bkFile").onchange=ev=>{
    const f=ev.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>applyImport(String(r.result));
    r.readAsText(f);
    ev.target.value="";
  };
  $("#bkText").onclick=()=>{
    const box=$("#bkArea");
    box.classList.toggle("hidden");
    if(!box.classList.contains("hidden"))$("#bkTa").value=JSON.stringify(S);
  };
  $("#bkCopy").onclick=async()=>{
    const ta=$("#bkTa");
    let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(e){}
    if(!ok){try{ta.select();ok=document.execCommand("copy");}catch(e){}}
    $("#bkCopy").textContent=ok?"복사됨":"복사 실패";
    setTimeout(()=>{const b=$("#bkCopy");if(b)b.textContent="복사";},1500);
  };
  $("#bkRestore").onclick=()=>applyImport($("#bkTa").value);
}

  /* 인바디 */
  h+='<div class="rec-sec"><h3>인바디 기록</h3><table><thead><tr><th>날짜</th><th>체중 kg</th><th>골격근량 kg</th><th>체지방률 %</th></tr></thead><tbody>';
  S.inbody.slice().sort((a,b)=>a.d<b.d?-1:1).forEach(r=>{
    h+='<tr><td>'+r.d+'</td><td>'+r.w+'</td><td>'+r.m+'</td><td>'+r.f+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="ib-form"><input type="date" class="dt" id="ibD"><input type="number" step="0.1" class="num" id="ibW" placeholder="체중"><input type="number" step="0.1" class="num" id="ibM" placeholder="골격근"><input type="number" step="0.1" class="num" id="ibF" placeholder="체지방%"><button id="ibAdd">추가</button></div>';
  h+='<p class="note">아침 공복, 같은 시간대로 측정 조건을 통일하면 추세 비교가 정확해집니다.</p></div>';

  h+=backupHTML();

  area.innerHTML=h;
  $("#wkPrev").onclick=()=>{recOff--;renderRecord();};
  $("#wkNext").onclick=()=>{if(recOff<0){recOff++;renderRecord();}};
  bindBackup();
  $("#ibAdd").onclick=()=>{
    const d=$("#ibD").value,w=parseFloat($("#ibW").value),m=parseFloat($("#ibM").value),f=parseFloat($("#ibF").value);
    if(!d||isNaN(w)||isNaN(m)||isNaN(f)){alert("날짜와 세 수치를 모두 입력해 주세요.");return;}
    S.inbody=S.inbody.filter(r=>r.d!==d);
    S.inbody.push({d:d,w:w,m:m,f:f});
    saveState();renderRecord();
  };
}

/* ---------- 탭 ---------- */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    ["plan","dict","massage","habit","record"].forEach(t=>$("#tab-"+t).classList.toggle("hidden",t!==b.dataset.tab));
    if(b.dataset.tab==="record"){recOff=0;renderRecord();}
  };
});

/* ---------- 시작 ---------- */
(async function(){
  await loadState();
  updateSndBtn();
  (function(){const d=new Date(APP_UPDATED+"T00:00:00");const el=$("#updAt");if(el&&!isNaN(d))el.textContent=APP_UPDATED.replace(/-/g,".")+" "+"일월화수목금토"[d.getDay()];})();
  $("#sndBtn").onclick=()=>{S.mute=!S.mute;saveState();updateSndBtn();if(!S.mute)beep(880,0.12);};
  document.querySelectorAll(".addbar button").forEach(b=>b.onclick=()=>{
    const dk=dateKey(selDay),k=b.dataset.add;
    let a=S.extra[dk]||[];
    if(a.includes(k))a=a.filter(x=>x!==k);else a.push(k);
    if(a.length)S.extra[dk]=a;else delete S.extra[dk];
    saveState();stopExTimer();renderPlan();
  });
  renderDays();renderPlan();renderDict();renderMassage();renderHabits();
})();
</script>
</body>
</html>
